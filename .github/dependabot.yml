version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # The pgvector image is one pin shared by the Dockerfile client stage and the deployed
      # Postgres sidecar (compose, container-release.json, scripts, workflow), which Dependabot
      # cannot see. A sidecar image change needs a reviewed deploy-controller exception, so it
      # moves by hand, all references at once (guard: test_pgvector_client_and_server_images_are_one_pin).
      - dependency-name: "pgvector/pgvector"
      # Python minor upgrades are a deliberate fleet migration (all repos move together).
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
