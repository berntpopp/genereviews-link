name: Build corpus bundle

on:
  workflow_dispatch:
    inputs:
      disabled_notice:
        description: "This workflow is disabled. Build locally, publish with gh release create, then run Verify corpus bundle."
        required: false
        default: "disabled"
        type: string

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Corpus bundles are built locally: the embedding pass is far too slow for a hosted runner."
          echo "1. uv run genereview-link bundle publish-local --release-id YYYY-MM-DD-rN"
          echo "2. gh release create corpus-data-YYYY-MM-DD-rN --target <build revision> \\"
          echo "     corpus.dump manifest.json SHA256SUMS"
          echo "3. gh workflow run verify-corpus-bundle.yml -f release_tag=corpus-data-YYYY-MM-DD-rN"
