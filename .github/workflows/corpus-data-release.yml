name: Immutable data-only corpus release

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing immutable data-only source release tag
        required: true
        type: string
      object_id:
        description: Exact sealed handoff object ID to publish after rights review
        required: false
        type: string

concurrency:
  group: corpus-data-${{ github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18@sha256:42e7f6b4e1eceb02ff14e3e6bc6108bbe259abbe83879dc1845d0da1ddeb555d
        env:
          POSTGRES_DB: genereview
          POSTGRES_USER: genereview
          POSTGRES_PASSWORD: genereview
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U genereview"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Install package and create reviewed schema
        env:
          DATABASE_URL: postgresql://genereview:genereview@127.0.0.1:5432/genereview
        run: |
          set -euo pipefail
          uv sync --group dev --frozen
          uv run genereview-link db migrate
      - name: Bounded download and attest exact three-asset source into a fresh directory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          source_dir="$(mktemp -d "$RUNNER_TEMP/source.XXXXXX")"
          uv run python -m genereview_link.corpus.release_assets \
            --repo "$GITHUB_REPOSITORY" --tag "${{ inputs.source_tag }}" --dest "$source_dir"
          uv run python - "$source_dir/corpus.dump" <<'PY'
          from pathlib import Path
          from genereview_link.db.restore import assert_data_only_archive, read_archive_entries
          assert_data_only_archive(read_archive_entries(Path(__import__('sys').argv[1])))
          PY
          uv run python - "$source_dir" <<'PY'
          from pathlib import Path
          from genereview_link.corpus.handoff import verify_data_only_bundle
          verify_data_only_bundle(Path(__import__('sys').argv[1]))
          PY
          gh attestation verify "$source_dir/corpus.dump" --repo "$GITHUB_REPOSITORY"
          printf 'SOURCE_DIR=%s\n' "$source_dir" >> "$GITHUB_ENV"
      - name: Restore verified data only and prove the runtime contract
        env:
          PGPASSWORD: genereview
        run: |
          set -euo pipefail
          pg_restore --data-only --single-transaction --exit-on-error \
            --no-owner --no-privileges \
            -d postgresql://genereview:genereview@127.0.0.1:5432/genereview \
            "$SOURCE_DIR/corpus.dump"
          test "$(psql -h 127.0.0.1 -U genereview -d genereview -At -v ON_ERROR_STOP=1 -c \
            "select count(*) from pg_indexes where schemaname = 'genereview' and indexname = 'genereview_embeddings_bge384_hnsw_cosine'")" = 1
      - name: Seal the locally verified handoff
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/handoffs"
          rm -rf -- "$RUNNER_TEMP/publisher-tool"
          mkdir -- "$RUNNER_TEMP/publisher-tool"
          uv build --wheel --out-dir "$RUNNER_TEMP/publisher-tool"
          uv export --no-dev --no-emit-project --format requirements.txt \
            --output-file "$RUNNER_TEMP/publisher-requirements.txt"
          mkdir -- "$RUNNER_TEMP/publisher-dependencies"
          python3 -m pip download --require-hashes --only-binary=:all: \
            --dest "$RUNNER_TEMP/publisher-dependencies" \
            --requirement "$RUNNER_TEMP/publisher-requirements.txt"
          object_id="$(uv run genereview-link bundle seal-handoff --source "$SOURCE_DIR" --handoff-root "$root" --publisher-tool "$RUNNER_TEMP/publisher-tool")"
          printf '%s\n' "$object_id" > "$RUNNER_TEMP/object-id"
      - name: Upload sealed handoff only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-sealed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/handoffs
            ${{ runner.temp }}/object-id
            ${{ runner.temp }}/publisher-dependencies
          if-no-files-found: error
          retention-days: 3

  publish:
    if: ${{ inputs.object_id != '' }}
    needs: build
    runs-on: ubuntu-latest
    environment: data-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      OBJECT_ID: ${{ inputs.object_id }}
      GENEREVIEWS_RIGHTS_RECORD_JSON: ${{ vars.GENEREVIEWS_RIGHTS_RECORD_JSON }}
    steps:
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: corpus-sealed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sealed
      - name: Reverify exact sealed object and affirmative dated rights
        run: |
          set -euo pipefail
          test -n "$GENEREVIEWS_RIGHTS_RECORD_JSON"
          test "$(cat "$RUNNER_TEMP/sealed/object-id")" = "$OBJECT_ID"
          printf '%s' "$GENEREVIEWS_RIGHTS_RECORD_JSON" > "$RUNNER_TEMP/rights.json"
          tool="$RUNNER_TEMP/sealed/handoffs/$OBJECT_ID/publisher-tool.whl"
          test -f "$tool" && test ! -L "$tool"
          seal_manifest="$RUNNER_TEMP/sealed/handoffs/$OBJECT_ID/seal-manifest.json"
          test "$(sha256sum "$seal_manifest" | cut -d' ' -f1)" = "$OBJECT_ID"
          test "$(sha256sum "$tool" | cut -d' ' -f1)" = "$(jq -r '.publisher_tool.sha256' "$seal_manifest")"
          publisher_env="$RUNNER_TEMP/publisher-env"
          mkdir -- "$publisher_env"
          for dependency in "$RUNNER_TEMP"/sealed/publisher-dependencies/*.whl; do
            uv pip install --target "$publisher_env" --no-index --no-deps "$dependency"
          done
          uv pip install --target "$publisher_env" --no-index --no-deps "$tool"
          # This sealed wheel call performs verify_handoff/publish-handoff verification:
          # every file's no-follow digest/size/mode/source identity and the rights tuple.
          PYTHONPATH="$publisher_env" python3 - "$RUNNER_TEMP/sealed/handoffs" "$OBJECT_ID" "$RUNNER_TEMP/rights.json" <<'PY'
          import sys
          from pathlib import Path
          from genereview_link.corpus.handoff import prepare_publish_handoff
          try:
              sealed = prepare_publish_handoff(Path(sys.argv[1]), sys.argv[2], Path(sys.argv[3]))
          except Exception as error:
              raise SystemExit(f"publish-handoff refused: {error}") from error
          print(f"rights-bound handoff ready: {sealed.object_id}")
          PY
          printf 'PUBLISHER_ENV=%s\n' "$publisher_env" >> "$GITHUB_ENV"
      - name: Attest the exact sealed object before publication
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/sealed/handoffs/${{ inputs.object_id }}/corpus.dump
      - name: Four-state immutable publication gate
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/sealed/handoffs/$OBJECT_ID"
          release_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["corpus_release_id"])' "$handoff/manifest.json")"
          tag="corpus-data-$release_id"
          verify_existing() {
            existing="$(mktemp -d "$RUNNER_TEMP/existing.XXXXXX")"
            PYTHONPATH="$PUBLISHER_ENV" python3 -m genereview_link.corpus.release_assets \
              --repo "$GH_REPO" --tag "$tag" --dest "$existing"
            PYTHONPATH="$PUBLISHER_ENV" python3 - "$RUNNER_TEMP/sealed/handoffs" "$OBJECT_ID" "$RUNNER_TEMP/rights.json" <<'PY'
          import sys
          from pathlib import Path
          from genereview_link.corpus.handoff import prepare_publish_handoff
          prepare_publish_handoff(Path(sys.argv[1]), sys.argv[2], Path(sys.argv[3]))
          PY
            gh attestation verify "$existing/corpus.dump" --repo "$GH_REPO"
            for asset in corpus.dump manifest.json SHA256SUMS; do
              test -f "$existing/$asset" && test ! -L "$existing/$asset"
              cmp -- "$handoff/$asset" "$existing/$asset"
            done
          }
          state=collision
          release_json="$(mktemp "$RUNNER_TEMP/release.XXXXXX")"
          release_error="$(mktemp "$RUNNER_TEMP/release-error.XXXXXX")"
          if gh api "repos/$GH_REPO/releases/tags/$tag" >"$release_json" 2>"$release_error"; then
            if test "$(jq -r .draft <"$release_json")" = false; then
              state=published_noop
            else
              state=draft_publish_existing
            fi
          elif grep -Fq 'HTTP 404' "$release_error"; then
            state=create
          else
            cat "$release_error" >&2
            echo "release lookup failed; refusing to create" >&2
            exit 1
          fi
          case "$state" in
            published_noop) verify_existing; echo "published_noop: exact immutable release verified" ;;
            draft_publish_existing) verify_existing; gh release edit "$tag" --draft=false ;;
            create) gh release create "$tag" --draft --title "$tag" "$handoff/corpus.dump" "$handoff/manifest.json" "$handoff/SHA256SUMS" && gh attestation verify "$handoff/corpus.dump" --repo "$GH_REPO" && gh release edit "$tag" --draft=false ;;
            collision) echo "collision: refusing unknown release state" >&2; exit 1 ;;
          esac
