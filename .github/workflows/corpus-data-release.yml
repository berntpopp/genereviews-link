name: Immutable data-only corpus release

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing immutable data-only source release tag
        required: true
        type: string
      object_id:
        description: Exact sealed handoff object ID to publish after rights review
        required: false
        type: string

concurrency:
  group: corpus-data-${{ github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18@sha256:42e7f6b4e1eceb02ff14e3e6bc6108bbe259abbe83879dc1845d0da1ddeb555d
        env:
          POSTGRES_DB: genereview
          POSTGRES_USER: genereview
          POSTGRES_PASSWORD: genereview
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U genereview"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Install package and create reviewed schema
        env:
          DATABASE_URL: postgresql://genereview:genereview@127.0.0.1:5432/genereview
        run: |
          set -euo pipefail
          uv sync --group dev --frozen
          uv run genereview-link db migrate
      - name: Download exact three-asset source into a fresh directory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          source_dir="$(mktemp -d "$RUNNER_TEMP/source.XXXXXX")"
          gh release download "${{ inputs.source_tag }}" --repo "$GITHUB_REPOSITORY" \
            --pattern corpus.dump --pattern manifest.json --pattern SHA256SUMS --dir "$source_dir"
          test "$(find "$source_dir" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 3
          (cd "$source_dir" && sha256sum --check SHA256SUMS)
          uv run python -c 'from pathlib import Path; from genereview_link.corpus.handoff import verify_data_only_bundle; verify_data_only_bundle(Path("'"$source_dir"'"))'
          printf 'SOURCE_DIR=%s\n' "$source_dir" >> "$GITHUB_ENV"
      - name: Restore verified data only and prove the runtime contract
        env:
          PGPASSWORD: genereview
        run: |
          set -euo pipefail
          pg_restore --data-only --single-transaction --exit-on-error \
            -d postgresql://genereview:genereview@127.0.0.1:5432/genereview \
            "$SOURCE_DIR/corpus.dump"
          psql -h 127.0.0.1 -U genereview -d genereview -v ON_ERROR_STOP=1 -c \
            "select indexname from pg_indexes where indexname = 'genereview_embeddings_bge384_hnsw_cosine'"
      - name: Seal the locally verified handoff
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/handoffs"
          object_id="$(uv run genereview-link bundle seal-handoff --source "$SOURCE_DIR" --handoff-root "$root")"
          printf '%s\n' "$object_id" > "$RUNNER_TEMP/object-id"
      - name: Upload sealed handoff only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-sealed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/handoffs
            ${{ runner.temp }}/object-id
          if-no-files-found: error
          retention-days: 3

  publish:
    if: ${{ inputs.object_id != '' }}
    needs: build
    runs-on: ubuntu-latest
    environment: data-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      OBJECT_ID: ${{ inputs.object_id }}
      GENEREVIEWS_RIGHTS_RECORD_JSON: ${{ vars.GENEREVIEWS_RIGHTS_RECORD_JSON }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: corpus-sealed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sealed
      - name: Reverify exact sealed object and affirmative dated rights
        run: |
          set -euo pipefail
          test -n "$GENEREVIEWS_RIGHTS_RECORD_JSON"
          printf '%s' "$GENEREVIEWS_RIGHTS_RECORD_JSON" > "$RUNNER_TEMP/rights.json"
          # publish-handoff is deliberately object-bound: a publisher has no checkout.
          python3 - "$RUNNER_TEMP/sealed/handoffs/$OBJECT_ID" "$RUNNER_TEMP/rights.json" "$OBJECT_ID" <<'PY'
          import hashlib, json, stat, sys
          from datetime import datetime
          root, rights, object_id = map(__import__('pathlib').Path, sys.argv[1:])
          required = {'object_id','decision','authority','decision_time','terms_version','permitted_asset_use','attribution','evidence_uri'}
          record = json.loads(rights.read_bytes())
          if set(record) != required or record.get('object_id') != object_id or record.get('decision') != 'affirmative' or not record.get('decision_time','').endswith('Z'):
              raise SystemExit('rights record is not complete, affirmative, dated, and object-bound')
          try:
              datetime.fromisoformat(record['decision_time'][:-1] + '+00:00')
          except ValueError:
              raise SystemExit('rights record timestamp is not ISO-8601 UTC')
          manifest = root / 'seal-manifest.json'
          if hashlib.sha256(manifest.read_bytes()).hexdigest() != object_id:
              raise SystemExit('sealed object does not match requested ID')
          if {p.name for p in root.iterdir()} != {'corpus.dump','manifest.json','SHA256SUMS','seal-manifest.json'} or any(p.is_symlink() or not stat.S_ISREG(p.lstat().st_mode) for p in root.iterdir()):
              raise SystemExit('sealed object has unsafe or unexpected assets')
          PY
      - name: Attest the exact sealed object before publication
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v3.0.0
        with:
          subject-path: ${{ runner.temp }}/sealed/handoffs/${{ inputs.object_id }}/seal-manifest.json
      - name: Four-state immutable publication gate
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/sealed/handoffs/$OBJECT_ID"
          release_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["corpus_release_id"])' "$handoff/manifest.json")"
          tag="corpus-data-$release_id"
          verify_existing() {
            existing="$(mktemp -d "$RUNNER_TEMP/existing.XXXXXX")"
            gh release download "$tag" --dir "$existing"
            test "$(find "$existing" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 3
            for asset in corpus.dump manifest.json SHA256SUMS; do
              test -f "$existing/$asset" && test ! -L "$existing/$asset"
              cmp -- "$handoff/$asset" "$existing/$asset"
            done
          }
          state=collision
          if existing="$(gh release view "$tag" --json isDraft 2>/dev/null)"; then
            if test "$(jq -r .isDraft <<<"$existing")" = false; then
              state=published_noop
            else
              state=draft_publish_existing
            fi
          else
            state=create
          fi
          case "$state" in
            published_noop) verify_existing; echo "published_noop: exact immutable release verified" ;;
            draft_publish_existing) verify_existing; gh release edit "$tag" --draft=false ;;
            create) gh release create "$tag" --draft --title "$tag" "$handoff/corpus.dump" "$handoff/manifest.json" "$handoff/SHA256SUMS" && gh release edit "$tag" --draft=false ;;
            collision) echo "collision: refusing unknown release state" >&2; exit 1 ;;
          esac
