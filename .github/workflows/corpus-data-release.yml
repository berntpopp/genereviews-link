name: Immutable data-only corpus release

on:
  workflow_dispatch:
    inputs:
      object_id:
        description: Exact sealed handoff object ID to publish after rights review
        required: false
        type: string

concurrency:
  group: corpus-data-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate dispatch state machine
        env:
          OBJECT_ID: ${{ inputs.object_id }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -euo pipefail
          object_id="${OBJECT_ID:-}"
          if test -z "$object_id"; then
            exit 0
          fi
          if ! grep -Eq '^[0-9a-f]{64}$' <<<"$object_id"; then
            echo 'object_id must be a lowercase SHA-256' >&2
            exit 1
          fi
          test "$REF_NAME" = refs/heads/main || {
            echo 'rights-gated publication must run from refs/heads/main' >&2
            exit 1
          }
  build:
    if: ${{ needs.validate.result == 'success' && inputs.object_id == '' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18@sha256:42e7f6b4e1eceb02ff14e3e6bc6108bbe259abbe83879dc1845d0da1ddeb555d
        env:
          POSTGRES_DB: genereview
          POSTGRES_USER: genereview
          POSTGRES_PASSWORD: genereview
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U genereview"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use digest-pinned PostgreSQL 18 client tools
        run: |
          set -euo pipefail
          client_bin="$RUNNER_TEMP/pg18-bin"
          mkdir -m 0700 -- "$client_bin"
          for tool in pg_dump pg_restore psql; do
            ln -s "$GITHUB_WORKSPACE/scripts/pg18-client" "$client_bin/$tool"
          done
          printf 'PG18_MOUNT_ROOT=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf '%s\n' "$client_bin" >> "$GITHUB_PATH"
          PG18_MOUNT_ROOT="$RUNNER_TEMP" "$client_bin/pg_dump" --version | grep -Eq 'PostgreSQL\) 18\.'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Install package and create reviewed schema
        env:
          DATABASE_URL: postgresql://genereview:genereview@127.0.0.1:5432/genereview
        run: |
          set -euo pipefail
          uv sync --group dev --extra cpu --frozen
          uv run genereview-link db migrate
      - name: Fetch and freeze the exact reviewed embedding model snapshot
        run: |
          set -euo pipefail
          timeout 10m uv run python - <<'PY'
          import hashlib
          from pathlib import Path
          import sentence_transformers, torch, transformers
          from huggingface_hub import snapshot_download
          from genereview_link.retrieval.model_identity import BGE_MODEL_FILES, BGE_MODEL_NAME, BGE_MODEL_REVISION
          snapshot = Path(snapshot_download(BGE_MODEL_NAME, revision=BGE_MODEL_REVISION))
          actual = {
              path.relative_to(snapshot).as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in snapshot.rglob("*") if path.is_file()
          }
          if actual != BGE_MODEL_FILES:
              raise SystemExit("reviewed model/tokenizer/config snapshot identity mismatch")
          print(BGE_MODEL_REVISION, torch.__version__, sentence_transformers.__version__, transformers.__version__)
          PY
          printf 'HF_HUB_OFFLINE=1\nTRANSFORMERS_OFFLINE=1\n' >> "$GITHUB_ENV"
      - name: Ingest the normalized upstream snapshot into the reviewed schema
        env:
          DATABASE_URL: postgresql://genereview:genereview@127.0.0.1:5432/genereview
          GENEREVIEWS_SOURCE_LOCATOR: ${{ secrets.GENEREVIEWS_SOURCE_LOCATOR }}
          GENEREVIEWS_SOURCE_REPOSITORIES: ${{ vars.GENEREVIEWS_SOURCE_REPOSITORIES }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$GENEREVIEWS_SOURCE_LOCATOR"
          test "$(printf %s "$GENEREVIEWS_SOURCE_LOCATOR" | wc -c)" -le 49152
          retained="$RUNNER_TEMP/retained-source"
          mkdir -m 0700 -- "$retained"
          RETAINED_SOURCE="$retained" uv run python - <<'PY'
          import asyncio, os
          from pathlib import Path
          from genereview_link.corpus.source_locator import fetch_source_assets
          asyncio.run(fetch_source_assets(
              os.environ["GENEREVIEWS_SOURCE_LOCATOR"].encode(),
              allowed_repositories={value for value in os.environ["GENEREVIEWS_SOURCE_REPOSITORIES"].split(",") if value},
              destination=Path(os.environ["RETAINED_SOURCE"]),
              token=os.environ["GH_TOKEN"],
          ))
          PY
          uv run genereview-link ingest \
            --archive "$retained/gene_NBK1116.tar.gz" \
            --side-data-dir "$retained" \
            --source-metadata "$retained/source-capture.json" \
            --prior-manifest "$retained/prior-manifest.json" \
            --prior-seal-manifest "$retained/prior-seal-manifest.json"
      - name: Build embeddings and rebuild HNSW from reviewed code
        env:
          DATABASE_URL: postgresql://genereview:genereview@127.0.0.1:5432/genereview
        run: |
          set -euo pipefail
          uv run genereview-link embed
          uv run genereview-link embed --index-only
      - name: Select identity-aware release suffix and build/evaluate one locked snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          PGPASSWORD: genereview
          DATABASE_URL: postgresql://genereview:genereview@127.0.0.1:5432/genereview
        run: |
          set -euo pipefail
          source_date="$(psql -h 127.0.0.1 -U genereview -d genereview -At -v ON_ERROR_STOP=1 -c \
            "select split_part(file_list_etag, ' ', 1) from public.genereview_corpus_version where is_active")"
          grep -Eq '^20[0-9]{2}-[0-9]{2}-[0-9]{2}$' <<<"$source_date"
          tags="$RUNNER_TEMP/release-tags.txt"
          : >"$tags"
          complete=false
          for page in $(seq 1 100); do
            page_json="$RUNNER_TEMP/release-page-$page.json"
            timeout 60s gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page" >"$page_json"
            jq -e 'type == "array" and length <= 100' "$page_json" >/dev/null
            jq -r '.[].tag_name | select(type == "string")' "$page_json" >>"$tags"
            if test "$(jq -er length "$page_json")" -lt 100; then complete=true; break; fi
          done
          test "$complete" = true
          refs="$RUNNER_TEMP/tag-refs.json"
          : >"$RUNNER_TEMP/tag-ref-pages.jsonl"
          refs_complete=false
          for page in $(seq 1 100); do
            ref_page="$RUNNER_TEMP/tag-ref-page-$page.json"
            timeout 60s gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/corpus-data-?per_page=100&page=$page" >"$ref_page"
            jq -e 'type == "array" and length <= 100' "$ref_page" >/dev/null
            jq -c '.[]' "$ref_page" >>"$RUNNER_TEMP/tag-ref-pages.jsonl"
            if test "$(jq -er length "$ref_page")" -lt 100; then refs_complete=true; break; fi
          done
          test "$refs_complete" = true
          jq -sc '.' "$RUNNER_TEMP/tag-ref-pages.jsonl" >"$refs"
          jq -r '.[].ref | sub("^refs/tags/corpus-data-"; "corpus-data-")' "$refs" >>"$tags"
          psql -h 127.0.0.1 -U genereview -d genereview -At -v ON_ERROR_STOP=1 -c "
            select jsonb_build_object(
              'listing_relpath', listing_relpath, 'last_updated', file_list_etag,
              'tarball', jsonb_build_object('sha256', tarball_sha256, 'size_bytes', tarball_size_bytes),
              'side_data', jsonb_build_object(
                'GRtitle_shortname_NBKid.txt', jsonb_build_object('sha256', sidedata_title_sha256, 'size_bytes', sidedata_title_size_bytes),
                'NBKid_shortname_genesymbol.txt', jsonb_build_object('sha256', sidedata_genes_sha256, 'size_bytes', sidedata_genes_size_bytes),
                'NBKid_shortname_OMIM.txt', jsonb_build_object('sha256', sidedata_omim_sha256, 'size_bytes', sidedata_omim_size_bytes)))
            from public.genereview_corpus_version where is_active and ingest_status='completed'" \
            > "$RUNNER_TEMP/local-source-identity.json"
          jq -e 'type == "object"' "$RUNNER_TEMP/local-source-identity.json" >/dev/null
          max_suffix="$(sed -n "s/^corpus-data-${source_date}-r\\([1-9][0-9]*\\)$/\\1/p" "$tags" | sort -n | tail -n1)"
          max_suffix="${max_suffix:-0}"
          test "$max_suffix" -le 10000 || {
            echo 'same-date release suffix inventory exceeds the reviewed exhaustive bound' >&2
            exit 1
          }
          scan_limit=$((max_suffix + 1))
          first_free_release_id=""
          published_noop=""
          for n in $(seq 1 "$scan_limit"); do
            candidate="$source_date-r$n"
            candidate_tag="corpus-data-$candidate"
            matches="$(jq -sc --arg tag "$candidate_tag" '[.[][] | select(.tag_name == $tag)]' "$RUNNER_TEMP"/release-page-*.json)"
            match_count="$(jq -er length <<<"$matches")"
            test "$match_count" -le 1
            if test "$match_count" = 1; then
              manifest_id="$(jq -er '.[0].assets | map(select(.name == "manifest.json")) | select(length == 1) | .[0].id' <<<"$matches")"
              manifest_size="$(jq -er '.[0].assets | map(select(.name == "manifest.json")) | select(length == 1) | .[0].size' <<<"$matches")"
              manifest_digest="$(jq -er '.[0].assets | map(select(.name == "manifest.json")) | select(length == 1) | .[0].digest' <<<"$matches")"
              test "$manifest_size" -le $((1024 * 1024))
              remote_manifest="$RUNNER_TEMP/existing-manifest-$n.json"
              timeout 2m curl --fail --silent --show-error --location \
                --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 120 \
                --max-filesize "$manifest_size" --header 'Accept: application/octet-stream' \
                --header "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$manifest_id" \
                --output "$remote_manifest"
              test "$(stat -c %s "$remote_manifest")" = "$manifest_size"
              test "sha256:$(sha256sum "$remote_manifest" | cut -d' ' -f1)" = "$manifest_digest"
              if jq -e --argjson local "$(cat "$RUNNER_TEMP/local-source-identity.json")" \
                --arg tag "$candidate_tag" \
                '.source == $local' "$remote_manifest" >/dev/null \
                && jq -e --arg tag "$candidate_tag" \
                  '.[] | select(.tag_name == $tag and .draft == false and .immutable == true)' \
                  <<<"$matches" >/dev/null; then
                if test -z "$published_noop"; then
                  release_id="$candidate"
                  published_noop="$candidate_tag"
                  echo "published_noop source identity candidate: $candidate_tag"
                fi
              fi
              continue
            fi
            if test -z "$first_free_release_id" \
              && ! jq -e --arg ref "refs/tags/$candidate_tag" '.[] | select(.ref == $ref)' "$refs" >/dev/null; then
              first_free_release_id="$candidate"
            fi
          done
          if test -z "${release_id:-}"; then release_id="$first_free_release_id"; fi
          test -n "$release_id"
          # Drafts, published releases, and tag-only refs were exhausted above. A differing
          # collision is occupied; an exact source identity is handed to the immutable verifier
          # as a possible published_noop, never selected by an arbitrary operator-provided rN.
          # Fresh evaluation runs inside bundle build's locked export-snapshot transaction.
          uv run genereview-link bundle build --release-id "$release_id" \
            --output "$RUNNER_TEMP/source"
          source_dir="$RUNNER_TEMP/source"
          if test -n "$published_noop"; then
            existing="$(jq -sc --arg tag "$published_noop" '[.[][] | select(.tag_name == $tag)][0]' "$RUNNER_TEMP"/release-page-*.json)"
            exact=true
            for asset in corpus.dump manifest.json SHA256SUMS rights-record.json rights-evidence.json terms-snapshot.html seal-manifest.json publisher-tool.whl; do
              asset_id="$(jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .id' <<<"$existing")"
              size="$(jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .size' <<<"$existing")"
              digest="$(jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .digest' <<<"$existing")"
              if test "$asset" = corpus.dump; then limit=$((2 * 1024 * 1024 * 1024)); else limit=$((1024 * 1024)); fi
              test "$size" -gt 0 && test "$size" -le "$limit"
              remote="$RUNNER_TEMP/existing-$asset"
              timeout 45m curl --fail --silent --show-error --location \
                --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 2700 \
                --max-filesize "$size" --header 'Accept: application/octet-stream' \
                --header "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                --output "$remote"
              test "$(stat -c %s "$remote")" = "$size"
              test "sha256:$(sha256sum "$remote" | cut -d' ' -f1)" = "$digest"
              if test "$asset" = rights-record.json; then
                uv run python - "$remote" "$source_dir/manifest.json" "$source_dir/corpus.dump" <<'PY' || exact=false
          import hashlib, json, re, sys
          from pathlib import Path
          from genereview_link.corpus.rights import RIGHTS_FIELDS
          rights_path, manifest_path, dump_path = map(Path, sys.argv[1:])
          record = json.loads(rights_path.read_bytes())
          manifest = json.loads(manifest_path.read_bytes())
          with dump_path.open("rb") as stream:
              artifact_sha256 = hashlib.file_digest(stream, "sha256").hexdigest()
          unsigned = {key: value for key, value in record.items() if key != "rights_record_sha256"}
          canonical = (json.dumps(unsigned, sort_keys=True, separators=(",", ":")) + "\n").encode()
          valid = (
              isinstance(record, dict)
              and set(record) == RIGHTS_FIELDS
              and record.get("decision") == "affirmative"
              and record.get("corpus_release_id") == manifest.get("corpus_release_id")
              and record.get("source_sha256") == manifest.get("tarball_source_sha256")
              and record.get("artifact_sha256") == artifact_sha256
              and record.get("rights_record_sha256") == hashlib.sha256(canonical).hexdigest()
              and all(re.fullmatch(r"[0-9a-f]{64}", str(record.get(key, ""))) for key in ("object_id", "terms_sha256", "evidence_sha256"))
          )
          if not valid:
              raise SystemExit("existing rights record is not the exact candidate identity")
          PY
              elif test "$asset" = rights-evidence.json || test "$asset" = terms-snapshot.html; then
                # These public records are verified through the protected rights locator
                # in the privileged publication phase; source-only builds have no secret.
                :
              elif test "$asset" = seal-manifest.json || test "$asset" = publisher-tool.whl; then
                :
              else
                cmp -- "$source_dir/$asset" "$remote" || exact=false
              fi
            done
            if test "$exact" != true; then
              release_id=""
              for n in $(seq 1 "$scan_limit"); do
                candidate="$source_date-r$n"
                if ! grep -Fxq "corpus-data-$candidate" "$tags"; then release_id="$candidate"; break; fi
              done
              test -n "$release_id"
              source_dir="$RUNNER_TEMP/source-final"
              uv run genereview-link bundle build --release-id "$release_id" --output "$source_dir"
              published_noop=""
            fi
          fi
          uv run python - "$source_dir/corpus.dump" <<'PY'
          import sys
          from pathlib import Path
          from genereview_link.db.restore import assert_data_only_archive, read_archive_entries
          assert_data_only_archive(read_archive_entries(Path(sys.argv[1])))
          PY
          # The restore contract is data-only and fail-closed; these flags are
          # repeated at the actual privileged restore call in the verifier job.
          pg_restore --list --data-only --no-owner --no-privileges "$source_dir/corpus.dump" >/dev/null
          # pg_restore --single-transaction --exit-on-error is mandatory for restore.
          printf 'SOURCE_DIR=%s\nRELEASE_ID=%s\n' "$source_dir" "$release_id" >> "$GITHUB_ENV"
      - name: Stage the evaluated build output for provenance only
        run: |
          set -euo pipefail
          mkdir -m 0700 -- "$RUNNER_TEMP/reviewed-build"
          cp -- "$SOURCE_DIR/corpus.dump" "$SOURCE_DIR/manifest.json" "$SOURCE_DIR/SHA256SUMS" \
            "$RUNNER_TEMP/reviewed-build/"
      - name: Attest the exact evaluated build output
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/reviewed-build/corpus.dump
            ${{ runner.temp }}/reviewed-build/manifest.json
            ${{ runner.temp }}/reviewed-build/SHA256SUMS
  publish:
    if: ${{ needs.validate.result == 'success' && inputs.object_id != '' && github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: data-release
    permissions:
      actions: write
      contents: write
      id-token: write
      attestations: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      OBJECT_ID: ${{ inputs.object_id }}
      GENEREVIEWS_HANDOFF_LOCATOR: ${{ secrets.GENEREVIEWS_HANDOFF_LOCATOR }}
      GENEREVIEWS_HANDOFF_REPOSITORIES: ${{ vars.GENEREVIEWS_HANDOFF_REPOSITORIES }}
      GENEREVIEWS_RIGHTS_LOCATOR: ${{ secrets.GENEREVIEWS_RIGHTS_LOCATOR }}
      GENEREVIEWS_RIGHTS_REPOSITORIES: ${{ vars.GENEREVIEWS_RIGHTS_REPOSITORIES }}
    steps:
      - name: Fetch durable digest-addressed sealed handoff
        run: |
          set -euo pipefail
          test -n "$GENEREVIEWS_HANDOFF_LOCATOR"
          test "$(printf %s "$GENEREVIEWS_HANDOFF_LOCATOR" | wc -c)" -le 49152
          locator="$RUNNER_TEMP/handoff-locator.json"
          printf '%s' "$GENEREVIEWS_HANDOFF_LOCATOR" >"$locator"
          jq -e --arg object "$OBJECT_ID" --arg revision "$GITHUB_SHA" \
            '.format == "genereviews-handoff-locator-v1" and .object_id == $object and
             .build_revision == $revision and (.assets | length == 5) and
             ([.assets[].name] | sort | .[0:4] | length == 4)' "$locator" >/dev/null
          handoff_root="$RUNNER_TEMP/sealed/handoffs"
          handoff_object="$handoff_root/$OBJECT_ID"
          mkdir -m 0700 -p -- "$handoff_object"
          repositories=",${GENEREVIEWS_HANDOFF_REPOSITORIES},"
          jq -cer '.assets[]' "$locator" | while IFS= read -r asset; do
            name="$(jq -er '.name | select(test("^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"))' <<<"$asset")"
            url="$(jq -er .url <<<"$asset")"
            repository="$(sed -En 's#^https://api\.github\.com/repos/([^/]+/[^/]+)/releases/assets/[1-9][0-9]{0,18}$#\1#p' <<<"$url")"
            test -n "$repository" && [[ "$repositories" == *",$repository,"* ]]
            size="$(jq -er '.size_bytes | select(type == "number" and floor == . and . > 0)' <<<"$asset")"
            digest="$(jq -er '.sha256 | select(test("^[0-9a-f]{64}$"))' <<<"$asset")"
            if test "$name" = corpus.dump; then limit=$((4 * 1024 * 1024 * 1024)); else limit=$((64 * 1024 * 1024)); fi
            test "$size" -le "$limit"
            target="$handoff_object/$name"
            timeout 45m curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 2700 \
              --max-filesize "$size" --header 'Accept: application/octet-stream' \
              --header "Authorization: Bearer $GH_TOKEN" "$url" --output "$target"
            test "$(stat -c %s "$target")" = "$size"
            test "$(sha256sum "$target" | cut -d' ' -f1)" = "$digest"
            chmod 0400 "$target"
          done
          test "$(find "$handoff_object" -maxdepth 1 -type f | wc -l)" = 5
          chmod 0500 "$handoff_object"
      - name: Reverify exact sealed object and affirmative dated rights
        run: |
          set -euo pipefail
          test -n "$GENEREVIEWS_RIGHTS_LOCATOR"
          test "$(printf %s "$GENEREVIEWS_RIGHTS_LOCATOR" | wc -c)" -le 49152
          handoff_root="$RUNNER_TEMP/sealed/handoffs"
          handoff_object="$handoff_root/$OBJECT_ID"
          test -d "$handoff_root" && test ! -L "$handoff_root"
          test -d "$handoff_object" && test ! -L "$handoff_object"
          chmod 0700 "$handoff_root"
          chmod 0500 "$handoff_object"
          wheel_name="$(jq -er '.publisher_tool.name | select(test("\\.whl$"))' "$handoff_object/seal-manifest.json")"
          grep -Eq '^[A-Za-z0-9][A-Za-z0-9._]*-[A-Za-z0-9][A-Za-z0-9._]*(-[A-Za-z0-9][A-Za-z0-9._]*)?-[A-Za-z0-9.]+-[A-Za-z0-9.]+-[A-Za-z0-9.]+\.whl$' <<<"$wheel_name"
          for name in corpus.dump manifest.json SHA256SUMS "$wheel_name" seal-manifest.json; do
            test -f "$handoff_object/$name" && test ! -L "$handoff_object/$name"
            chmod 0400 "$handoff_object/$name"
          done
          tool="$handoff_object/$wheel_name"
          test -f "$tool" && test ! -L "$tool"
          seal_manifest="$handoff_object/seal-manifest.json"
          test "$(sha256sum "$seal_manifest" | cut -d' ' -f1)" = "$OBJECT_ID"
          test "$(sha256sum "$tool" | cut -d' ' -f1)" = "$(jq -r '.publisher_tool.sha256' "$seal_manifest")"
          build_revision="$(jq -er '.app_git_sha | select(test("^[0-9a-f]{40}$"))' "$handoff_object/manifest.json")"
          printf 'PUBLISHER_WHEEL_NAME=%s\n' "$wheel_name" >> "$GITHUB_ENV"
          publisher_env="$RUNNER_TEMP/publisher-env"
          mkdir -- "$publisher_env"
          python3 -I - "$tool" "$publisher_env" <<'PY'
          import stat, sys, zipfile
          from pathlib import Path, PurePosixPath
          wheel, destination = map(Path, sys.argv[1:])
          with zipfile.ZipFile(wheel) as archive:
              infos = archive.infolist()
              if not infos or len(infos) > 1024 or sum(info.file_size for info in infos) > 64 * 1024 * 1024:
                  raise SystemExit("sealed wheel exceeds extraction bounds")
              for info in infos:
                  name = PurePosixPath(info.filename)
                  if name.is_absolute() or ".." in name.parts or info.flag_bits & 1:
                      raise SystemExit("sealed wheel contains an unsafe member")
                  mode = info.external_attr >> 16
                  if stat.S_IFMT(mode) not in {0, stat.S_IFREG, stat.S_IFDIR}:
                      raise SystemExit("sealed wheel contains a non-file member")
                  target = destination.joinpath(*name.parts)
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.read(info))
          PY
          # This is the stdlib-only equivalent of `bundle publish-handoff`: the sealed wheel
          # performs verify_handoff exact no-follow verification and the rights gate before
          # the privileged draft-first publisher is reached.  No wheel dependencies are needed.
          neutral="$RUNNER_TEMP/neutral-verifier"
          mkdir -- "$neutral"
          cd "$neutral"
          rights_bundle="$RUNNER_TEMP/rights-bundle"
          mkdir -m 0700 -- "$rights_bundle"
          python3 -I - "$publisher_env" "$rights_bundle" <<'PY'
          import os, sys
          from pathlib import Path
          target, destination = map(Path, sys.argv[1:])
          sys.path.insert(0, str(target.resolve()))
          from genereview_link.corpus.rights_locator import fetch_rights_assets
          fetch_rights_assets(
              os.environ["GENEREVIEWS_RIGHTS_LOCATOR"].encode(),
              allowed_repositories={value for value in os.environ["GENEREVIEWS_RIGHTS_REPOSITORIES"].split(",") if value},
              destination=destination,
              token=os.environ["GH_TOKEN"],
          )
          PY
          rights="$rights_bundle/rights-record.json"
          python3 -I - "$publisher_env" "$handoff_root" "$OBJECT_ID" "$rights" <<'PY'
          import os, sys
          from pathlib import Path
          target = Path(sys.argv[1]).resolve()
          sys.path.insert(0, str(target))
          import genereview_link.publisher_verifier as verifier
          module_file = Path(verifier.__file__).resolve()
          if target not in module_file.parents:
              raise SystemExit("sealed verifier import was shadowed outside the installed target")
          verifier.prepare_publish_handoff(Path(sys.argv[2]), sys.argv[3], Path(sys.argv[4]))
          print(f"module_file={module_file}")
          PY
          rights_digest="$(sha256sum "$rights" | cut -d' ' -f1)"
          printf 'RIGHTS_DIGEST=%s\n' "$rights_digest" >> "$GITHUB_ENV"
          printf 'PUBLISHER_ENV=%s\n' "$publisher_env" >> "$GITHUB_ENV"
          printf 'RIGHTS_BUNDLE=%s\n' "$rights_bundle" >> "$GITHUB_ENV"
      - name: Stage exact sealed publication inputs for attestation
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/sealed/handoffs/$OBJECT_ID"
          mkdir -m 0700 -- "$RUNNER_TEMP/publication-attestation"
          cp -- "$handoff/corpus.dump" "$handoff/seal-manifest.json" \
            "$handoff/$PUBLISHER_WHEEL_NAME" "$RUNNER_TEMP/publication-attestation/"
          mv -- "$RUNNER_TEMP/publication-attestation/$PUBLISHER_WHEEL_NAME" \
            "$RUNNER_TEMP/publication-attestation/publisher-tool.whl"
      - name: Attest exact sealed publication inputs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/publication-attestation/corpus.dump
            ${{ runner.temp }}/publication-attestation/seal-manifest.json
            ${{ runner.temp }}/publication-attestation/publisher-tool.whl
      - name: Four-state immutable publication gate
        run: |
          set -euo pipefail
          # Every state, including an already immutable no-op, verifies the exact
          # subject attestation and signer identity before any possible mutation.
          handoff="$RUNNER_TEMP/sealed/handoffs/$OBJECT_ID"
          corpus_release_id="$(jq -er .corpus_release_id "$handoff/manifest.json")"
          build_revision="$(jq -er '.app_git_sha | select(test("^[0-9a-f]{40}$"))' "$handoff/manifest.json")"
          test "$GITHUB_SHA" = "$build_revision"
          rights_digest="${RIGHTS_DIGEST:-}"
          terms_digest="$(jq -er '.terms_sha256 | select(test("^[0-9a-f]{64}$"))' "$RIGHTS_BUNDLE/rights-record.json")"
          evidence_digest="$(jq -er '.evidence_sha256 | select(test("^[0-9a-f]{64}$"))' "$RIGHTS_BUNDLE/rights-record.json")"
          grep -Eq '^[0-9a-f]{64}$' <<<"$rights_digest"
          grep -Eq '^20[0-9]{2}-[0-9]{2}-[0-9]{2}-r[1-9][0-9]*$' <<<"$corpus_release_id"
          tag="corpus-data-$corpus_release_id"

          sealed_python() {
            python3 -I -c \
              'import sys; target=sys.argv.pop(1); sys.path.insert(0,target); from genereview_link.corpus.release_promotion import main; main()' \
              "$PUBLISHER_ENV" "$@"
          }

          require_exact_tag() {
            response="$RUNNER_TEMP/required-tag-ref.json"
            timeout 60s gh api "repos/$GH_REPO/git/ref/tags/$tag" >"$response"
            tag_sha="$(jq -er '.object | select(.type == "tag") | .sha | select(test("^[0-9a-f]{40}$"))' "$response")"
            tag_object="$RUNNER_TEMP/required-tag-object.json"
            timeout 60s gh api "repos/$GH_REPO/git/tags/$tag_sha" >"$tag_object"
            python3 -I - "$PUBLISHER_ENV" "$response" "$tag_object" "$tag" "$build_revision" "$OBJECT_ID" <<'PY'
          import json, sys
          from pathlib import Path
          target, ref_path, object_path, tag, revision, object_id = sys.argv[1:]
          sys.path.insert(0, target)
          from genereview_link.corpus.release_transaction import verify_annotated_tag
          verify_annotated_tag(
              json.loads(Path(ref_path).read_text()), json.loads(Path(object_path).read_text()),
              tag=tag, target=revision, object_id=object_id,
          )
          PY
            jq -n --arg revision "$build_revision" '{object:{type:"commit",sha:$revision}}' >"$response"
          }

          dispatch_verifier() {
            phase="$1"
            dispatched_etag="$2"
            release_json="$3"
            assets_identity="$(jq -c '[.assets[] | {id,name,size,digest}] | sort_by(.name)' "$release_json")"
            assets_sha256="$(printf '%s\n' "$assets_identity" | sha256sum | cut -d' ' -f1)"
            publication_nonce="$(openssl rand -hex 32)"
            grep -Eq '^[0-9a-f]{64}$' <<<"$publication_nonce"
            dispatch_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            timeout 60s gh workflow run verify-corpus-bundle.yml --ref main \
              -f release_tag="$tag" -f release_id="$release_id" \
              -f target_commit="$build_revision" -f assets_sha256="$assets_sha256" \
              -f publication_nonce="$publication_nonce" -f verification_phase="$phase" \
              -f release_etag="$dispatched_etag" -f dispatch_time="$dispatch_time"
            verifier_run=""
            for _attempt in $(seq 1 30); do
              verifier_run="$(gh run list --workflow verify-corpus-bundle.yml --branch main \
                --event workflow_dispatch --limit 100 \
                --json databaseId,displayTitle,createdAt,headSha,event \
                --jq ".[] | select(.displayTitle == \"Verify corpus release $release_id ($publication_nonce)\" and .headSha == \"$build_revision\" and .event == \"workflow_dispatch\" and .createdAt >= \"$dispatch_time\") | .databaseId" | head -n1)"
              test -n "$verifier_run" && break
              sleep 2
            done
            test -n "$verifier_run"
            timeout 95m gh run watch "$verifier_run" --exit-status
            acceptance="$RUNNER_TEMP/$phase-acceptance"
            mkdir -- "$acceptance"
            gh run download "$verifier_run" \
              --name "corpus-publication-verification-$release_id" --dir "$acceptance"
            gh attestation verify "$acceptance/publication-verification.json" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/verify-corpus-bundle.yml" \
              --source-ref refs/heads/main --source-digest "$build_revision"
            expected="$RUNNER_TEMP/$phase-expected.json"
            jq -n --argjson release_id "$release_id" --arg target_commit "$build_revision" \
              --arg assets_sha256 "$assets_sha256" --arg nonce "$publication_nonce" \
              --arg dispatch_time "$dispatch_time" --arg phase "$phase" \
              --arg release_etag "$dispatched_etag" --arg source_ref refs/heads/main \
              '{release_id:$release_id,target_commit:$target_commit,assets_sha256:$assets_sha256,
                nonce:$nonce,dispatch_time:$dispatch_time,phase:$phase,
                release_etag:$release_etag,source_ref:$source_ref}' >"$expected"
            python3 -I - "$PUBLISHER_ENV" "$acceptance/publication-verification.json" \
              "$expected" "$verifier_run" <<'PY'
          import json, sys
          from pathlib import Path
          target = Path(sys.argv[1]).resolve()
          sys.path.insert(0, str(target))
          from genereview_link.corpus.dispatch_identity import verify_acceptance
          accepted = json.load(open(sys.argv[2]))
          expected = json.load(open(sys.argv[3]))
          if accepted.get("run_id") != int(sys.argv[4]):
              raise SystemExit("acceptance artifact run ID is not the selected fresh run")
          verify_acceptance(accepted, expected=expected)
          PY
          }

          verify_remote() {
            release_id="$1"
            grep -Eq '^[1-9][0-9]{0,18}$' <<<"$release_id"
            release_json="$RUNNER_TEMP/release-$release_id.json"
            release_headers="$RUNNER_TEMP/release-$release_id.headers"
            remote="$(mktemp -d "$RUNNER_TEMP/remote.XXXXXX")"
            timeout 60s curl --fail --silent --show-error \
              --proto '=https' --connect-timeout 15 --max-time 60 \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --dump-header "$release_headers" \
              "https://api.github.com/repos/$GH_REPO/releases/$release_id" \
              --output "$release_json"
            VERIFIED_ETAG="$(awk 'tolower($1) == "etag:" {print $2}' "$release_headers" | tr -d '\r' | tail -n1)"
            test -n "$VERIFIED_ETAG"
            jq -e --argjson id "$release_id" --arg tag "$tag" --arg revision "$build_revision" \
              --arg rights_marker "rights-record-sha256: $rights_digest" \
              --arg terms_marker "terms-sha256: $terms_digest" \
              --arg evidence_marker "rights-evidence-sha256: $evidence_digest" \
              '.id == $id and .tag_name == $tag and .target_commitish == $revision and
               .prerelease == false and
               (.body | contains($rights_marker) and contains($terms_marker) and contains($evidence_marker)) and
               ((.draft == true and .immutable == false and .published_at == null) or
                (.draft == false and .immutable == true and (.published_at | type == "string"))) and
               ([.assets[].name] | sort == ["SHA256SUMS", "corpus.dump", "manifest.json", "publisher-tool.whl", "rights-evidence.json", "rights-record.json", "seal-manifest.json", "terms-snapshot.html"])' \
              "$release_json" >/dev/null
            asset_ids="$(jq -cer '[.assets[].id] | select(length == 8 and (unique | length) == 8)' "$release_json")"
            jq -e 'all(.[]; type == "number" and . > 0 and floor == .)' <<<"$asset_ids" >/dev/null
            for asset in corpus.dump manifest.json SHA256SUMS rights-record.json rights-evidence.json terms-snapshot.html seal-manifest.json publisher-tool.whl; do
              asset_id="$(jq -er --arg asset "$asset" '.assets[] | select(.name == $asset) | .id | select(type == "number" and . > 0 and floor == .)' "$release_json")"
              size="$(jq -er --arg asset "$asset" '.assets[] | select(.name == $asset) | .size | select(type == "number" and . > 0 and floor == .)' "$release_json")"
              digest="$(jq -er --arg asset "$asset" '.assets[] | select(.name == $asset) | .digest | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))' "$release_json")"
            if test "$asset" = corpus.dump; then limit=$((2 * 1024 * 1024 * 1024)); else limit=$((1024 * 1024)); fi
              test "$size" -le "$limit"
              timeout 45m curl --fail --silent --show-error --location \
                --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 2700 \
                --max-filesize "$size" --header 'Accept: application/octet-stream' \
                --header "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$GH_REPO/releases/assets/$asset_id" \
                --output "$remote/$asset"
              test "$(stat -c %s "$remote/$asset")" = "$size"
              test "sha256:$(sha256sum "$remote/$asset" | cut -d' ' -f1)" = "$digest"
              expected_asset="$handoff/$asset"
              case "$asset" in
                rights-record.json|rights-evidence.json|terms-snapshot.html) expected_asset="$RIGHTS_BUNDLE/$asset" ;;
                publisher-tool.whl) expected_asset="$handoff/$PUBLISHER_WHEEL_NAME" ;;
              esac
              cmp -- "$expected_asset" "$remote/$asset"
            done
            REMOTE_DIR="$remote"
            (cd "$RUNNER_TEMP/neutral-verifier" && python3 -I - "$PUBLISHER_ENV" "$RUNNER_TEMP/sealed/handoffs" "$OBJECT_ID" "$RIGHTS_BUNDLE/rights-record.json" <<'PY'
          import sys
          from pathlib import Path
          target = Path(sys.argv[1]).resolve()
          sys.path.insert(0, str(target))
          import genereview_link.publisher_verifier as verifier
          module_file = Path(verifier.__file__).resolve()
          if target not in module_file.parents:
              raise SystemExit("sealed verifier import shadowed")
          verifier.prepare_publish_handoff(Path(sys.argv[2]), sys.argv[3], Path(sys.argv[4]))
          PY
            )
            for subject in "$remote/corpus.dump" "$remote/seal-manifest.json" "$remote/publisher-tool.whl"; do
              timeout 2m gh attestation verify "$subject" --repo "$GH_REPO" \
                --signer-workflow "$GH_REPO/.github/workflows/corpus-data-release.yml" \
                --source-ref refs/heads/main --source-digest "$build_revision"
            done
          }

          immutable_releases="$RUNNER_TEMP/immutable-releases.json"
          timeout 60s gh api "repos/$GH_REPO/immutable-releases" >"$immutable_releases"
          jq -e '.enabled == true' "$immutable_releases" >/dev/null

          inventory="$RUNNER_TEMP/release-inventory.jsonl"
          : >"$inventory"
          complete=false
          for page in $(seq 1 100); do
            page_json="$RUNNER_TEMP/release-page-$page.json"
            timeout 60s gh api "repos/$GH_REPO/releases?per_page=100&page=$page" >"$page_json"
            jq -e 'type == "array" and length <= 100' "$page_json" >/dev/null
            count="$(jq -er length "$page_json")"
            jq -c '.[] | {id, tag_name}' "$page_json" >>"$inventory"
            if test "$count" -lt 100; then complete=true; break; fi
          done
          test "$complete" = true
          matches="$(jq -sc --arg tag "$tag" '[.[] | select(.tag_name == $tag)]' "$inventory")"
          match_count="$(jq -er length <<<"$matches")"
          test "$match_count" -le 1

          promote=false
          if test "$match_count" = 1; then
            release_id="$(jq -er '.[0].id | select(type == "number" and . > 0 and floor == .) | tostring' <<<"$matches")"
            release_state="$RUNNER_TEMP/release-state.json"
            timeout 60s gh api "repos/$GH_REPO/releases/$release_id" >"$release_state"
          else
            # The inventory was read before this branch; recheck the canonical tag
            # immediately before creating the draft to close an external race.
            recheck_error="$RUNNER_TEMP/pre-create-tag.error"
            if timeout 60s gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>"$recheck_error"; then
              echo "release appeared after inventory; refusing duplicate mutation" >&2
              exit 1
            elif ! grep -Fq 'HTTP 404' "$recheck_error"; then
              cat "$recheck_error" >&2
              echo "release recheck failed; refusing mutation" >&2
              exit 1
            fi
            created="$RUNNER_TEMP/created-release.json"
            timeout 60s gh api --method POST "repos/$GH_REPO/releases" \
              -f tag_name="$tag" -f target_commitish="$build_revision" -f name="$tag" \
              -f body="Immutable GeneReviews research corpus; rights-record-sha256: $rights_digest; terms-sha256: $terms_digest; rights-evidence-sha256: $evidence_digest" \
              -F draft=true -F prerelease=false -F generate_release_notes=false >"$created"
            release_id="$(jq -er --arg tag "$tag" --arg revision "$build_revision" \
              'select(.tag_name == $tag and .target_commitish == $revision and
                      .draft == true and .immutable == false and .published_at == null and
                      .prerelease == false and (.assets | type == "array" and length == 0)) |
               .id | select(type == "number" and . > 0 and floor == .) | tostring' "$created")"
            grep -Eq '^[1-9][0-9]{0,18}$' <<<"$release_id"
            release_state="$created"
          fi

          expected_assets="$RUNNER_TEMP/expected-assets.json"
          : >"$RUNNER_TEMP/expected-assets.jsonl"
          for asset in corpus.dump manifest.json SHA256SUMS rights-record.json rights-evidence.json terms-snapshot.html seal-manifest.json publisher-tool.whl; do
            source_asset="$handoff/$asset"
            case "$asset" in
              rights-record.json|rights-evidence.json|terms-snapshot.html) source_asset="$RIGHTS_BUNDLE/$asset" ;;
              publisher-tool.whl) source_asset="$handoff/$PUBLISHER_WHEEL_NAME" ;;
            esac
            jq -cn --arg name "$asset" --arg digest "sha256:$(sha256sum "$source_asset" | cut -d' ' -f1)" \
              --argjson size "$(stat -c %s "$source_asset")" '{key:$name,value:{size:$size,digest:$digest}}' \
              >>"$RUNNER_TEMP/expected-assets.jsonl"
          done
          jq -sc 'from_entries' "$RUNNER_TEMP/expected-assets.jsonl" >"$expected_assets"
          plan="$RUNNER_TEMP/release-plan.json"
          python3 -I - "$PUBLISHER_ENV" "$release_state" "$expected_assets" "$tag" "$build_revision" \
            "$rights_digest" "$terms_digest" "$evidence_digest" "$plan" <<'PY'
          import json, sys
          from pathlib import Path
          target, release_path, expected_path, tag, revision, rights, terms, evidence, output = sys.argv[1:]
          sys.path.insert(0, target)
          from genereview_link.corpus.release_transaction import plan_release
          release = json.loads(Path(release_path).read_text())
          expected = json.loads(Path(expected_path).read_text())
          markers = (
              f"rights-record-sha256: {rights}", f"terms-sha256: {terms}",
              f"rights-evidence-sha256: {evidence}",
          )
          result = plan_release(
              release, tag=tag, target=revision, expected_assets=expected,
              required_body_markers=markers,
          )
          Path(output).write_text(json.dumps({"action": result.action, "missing": result.missing_assets}))
          PY
          action="$(jq -er .action "$plan")"
          if test "$action" = resume || test "$action" = create; then
            while IFS= read -r asset; do
              source_asset="$handoff/$asset"
              case "$asset" in
                rights-record.json|rights-evidence.json|terms-snapshot.html) source_asset="$RIGHTS_BUNDLE/$asset" ;;
                publisher-tool.whl) source_asset="$handoff/$PUBLISHER_WHEEL_NAME" ;;
              esac
              size="$(stat -c %s "$source_asset")"
              digest="sha256:$(sha256sum "$source_asset" | cut -d' ' -f1)"
              upload="$RUNNER_TEMP/upload-$asset.json"
              timeout 45m curl --fail --silent --show-error \
                --proto '=https' --connect-timeout 15 --max-time 2700 \
                --request POST --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header 'Content-Type: application/octet-stream' --data-binary "@$source_asset" \
                "https://uploads.github.com/repos/$GH_REPO/releases/$release_id/assets?name=$asset" \
                --output "$upload"
              jq -e --arg asset "$asset" --arg digest "$digest" --argjson size "$size" \
                '.name == $asset and .size == $size and .digest == $digest and
                 (.id | type == "number" and . > 0 and floor == .)' "$upload" >/dev/null
            done < <(jq -er '.missing[]' "$plan")
            verify_remote "$release_id"
            promote=true
          elif test "$action" = promote; then
            verify_remote "$release_id"
            promote=true
          elif test "$action" = noop; then
            verify_remote "$release_id"
            require_exact_tag
            FINAL_RELEASE_JSON="$RUNNER_TEMP/release-$release_id.json"
            FINAL_ETAG="$VERIFIED_ETAG"
            echo "published_noop: exact immutable release verified"
          else
            echo "sealed release planner returned an invalid action" >&2
            exit 1
          fi

          if test "$promote" = true; then
            # Freeze one exact release representation (ETag + asset IDs/digests), run
            # semantics only on bytes downloaded from that representation, then use the
            # same ETag for a conditional preflight and the only mutating PATCH.
            timeout 60s gh api "repos/$GH_REPO/immutable-releases" >"$immutable_releases"
            jq -e '.enabled == true' "$immutable_releases" >/dev/null
            verify_remote "$release_id"
            verified_etag="$VERIFIED_ETAG"
            before="$RUNNER_TEMP/release-$release_id.json"
            after="$RUNNER_TEMP/post-promotion-release.json"
            frozen="$RUNNER_TEMP/verified-release-state.json"
            sealed_python freeze \
              --release "$before" --etag "$verified_etag" --tag "$tag" \
              --target "$build_revision" --out "$frozen"
            dispatch_verifier prepublication "$verified_etag" "$before"
            jq -c '[.assets[] | {id, name, size, digest}] | sort_by(.name)' "$before" \
              >"$RUNNER_TEMP/pre-promotion-assets.json"
            precondition="$RUNNER_TEMP/precondition.status"
            timeout 60s curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}\n' --header "Authorization: Bearer $GH_TOKEN" \
              --header "If-None-Match: $verified_etag" \
              "https://api.github.com/repos/$GH_REPO/releases/$release_id" >"$precondition"
            test "$(cat "$precondition")" = 304
            tag_object="$RUNNER_TEMP/created-tag-object.json"
            timeout 60s gh api --method POST "repos/$GH_REPO/git/tags" \
              -f tag="$tag" -f message="GeneReviews sealed object $OBJECT_ID" \
              -f object="$build_revision" -f type=commit >"$tag_object"
            tag_object_sha="$(jq -er '.sha | select(test("^[0-9a-f]{40}$"))' "$tag_object")"
            tag_create_error="$RUNNER_TEMP/tag-create.error"
            if ! timeout 60s gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$tag_object_sha" 2>"$tag_create_error"; then
              grep -Eq 'HTTP 409|HTTP 422' "$tag_create_error" || { cat "$tag_create_error" >&2; exit 1; }
            fi
            require_exact_tag
            timeout 60s curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}\n' --header "Authorization: Bearer $GH_TOKEN" \
              --header "If-None-Match: $verified_etag" \
              "https://api.github.com/repos/$GH_REPO/releases/$release_id" >"$precondition"
            sealed_python prepatch --frozen "$frozen" --status "$(cat "$precondition")"
            timeout 60s gh api --method PATCH "repos/$GH_REPO/releases/$release_id" -H "If-Match: $verified_etag" \
              -F draft=false >"$after"
            jq -e --argjson id "$release_id" --arg tag "$tag" --arg revision "$build_revision" \
              '.id == $id and .tag_name == $tag and .target_commitish == $revision and
               .draft == false and .immutable == true and (.published_at | type == "string") and
               .prerelease == false' "$after" >/dev/null
            jq -c '[.assets[] | {id, name, size, digest}] | sort_by(.name)' "$after" \
              >"$RUNNER_TEMP/post-promotion-assets.json"
            cmp -- "$RUNNER_TEMP/pre-promotion-assets.json" "$RUNNER_TEMP/post-promotion-assets.json"
            require_exact_tag
            sealed_python post \
              --frozen "$frozen" --published "$after" \
              --tag-ref "$RUNNER_TEMP/required-tag-ref.json"
            verify_remote "$release_id"
            FINAL_RELEASE_JSON="$RUNNER_TEMP/release-$release_id.json"
            FINAL_ETAG="$VERIFIED_ETAG"
          fi

          # Post-publication acceptance is a separate, automatically dispatched verifier
          # bound to this exact release ID/tag/target/assets tuple. It never mutates a release.
          dispatch_verifier postpublication "$FINAL_ETAG" "$FINAL_RELEASE_JSON"
