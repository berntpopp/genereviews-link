name: Container CI

on:
  pull_request:
    paths:
      - "genereview_link/**"
      - "server.py"
      - "mcp_server.py"
      - "docker/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "container-release.json"
      - ".dockerignore"
      - ".env.docker.example"
      - "CHANGELOG.md"
      - ".github/workflows/container-ci.yml"
      - ".github/workflows/container-release.yml"
  push:
    branches:
      - main
    paths:
      - "genereview_link/**"
      - "server.py"
      - "mcp_server.py"
      - "docker/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "container-release.json"
      - ".dockerignore"
      - ".env.docker.example"
      - "CHANGELOG.md"
      - ".github/workflows/container-ci.yml"
      - ".github/workflows/container-release.yml"

permissions: {}

jobs:
  container-ci:
    permissions:
      contents: read
    uses: berntpopp/genefoundry-router/.github/workflows/_container-ci.yml@3d3cc20477828ddbd8a0c980b5b4f709e2612c02 # genefoundry-router v0.8.6
